spring:
  application:
    name: remote-roles-pipeline

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/remoteroles}
    username: ${DB_USER:remoteroles}
    password: ${DB_PASSWORD:localdev}
    hikari:
      # Ingestion runs wide but writes in short bursts; the pool only needs to
      # cover concurrent flushes, not the full fetch fan-out.
      maximum-pool-size: 12
      pool-name: remote-roles-pool

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

ingest:
  # How many boards to fetch at once. Virtual threads make this cheap, but the
  # number is still a politeness budget against other people's servers.
  concurrency: ${INGEST_CONCURRENCY:48}
  user-agent: ${INGEST_USER_AGENT:remote-roles/0.1 (+https://example.com/bot; jobs aggregator)}
  request-timeout: 30s
  # Boards that fail this many times in a row get retired to DEAD.
  max-consecutive-failures: 8
  # Aggregator crawl budget. WeWorkRemotely is a dozen whole-file requests and
  # ignores these. Himalayas is paginated behind Cloudflare and starts refusing
  # after ~60 requests, so each run walks a small slice and resumes next time.
  feed:
    max-pages: ${INGEST_FEED_MAX_PAGES:50}
    concurrency: ${INGEST_FEED_CONCURRENCY:1}
    pause-millis: ${INGEST_FEED_PAUSE_MS:400}

  schedule:
    enabled: ${INGEST_SCHEDULE_ENABLED:true}
    # Every day at 04:17 UTC. Off-the-hour on purpose: everybody's cron fires at
    # :00 and these are other people's servers.
    cron: ${INGEST_CRON:0 17 4 * * *}

# Newsletter. Collection is live; delivery is not.
#
# delivery.enabled stays false until there is SMTP and a verified sending domain.
# While it is false the only Mailer bean is LoggingMailer, which sends nothing, and
# every captured address stays PENDING -- unconfirmed, and not a mailing list.
newsletter:
  delivery:
    enabled: ${NEWSLETTER_DELIVERY_ENABLED:false}
  from-address: ${NEWSLETTER_FROM_ADDRESS:hello@example.com}
  from-name: ${NEWSLETTER_FROM_NAME:True Remote Roles}
  site-url: ${SITE_URL:http://localhost:3000}

# SMTP, for when delivery is switched on. Left unset on purpose: Spring's mail
# auto-configuration is inert without a host, so nothing tries to connect.
# spring.mail.host: smtp.example.com
# spring.mail.port: 587
# spring.mail.username: ...
# spring.mail.password: ...
# spring.mail.properties.mail.smtp.starttls.enable: true

logging:
  level:
    com.remoteroles: INFO
