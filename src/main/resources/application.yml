spring:
  application:
    name: remote-roles-pipeline

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/remoteroles}
    username: ${DB_USER:remoteroles}
    password: ${DB_PASSWORD:localdev}
    hikari:
      # Ingestion runs wide but writes in short bursts; the pool only needs to
      # cover concurrent flushes, not the full fetch fan-out.
      maximum-pool-size: 12
      pool-name: remote-roles-pool

  flyway:
    enabled: true
    locations: classpath:db/migration

  # SMTP. Spring's mail auto-configuration is inert without a host, so an empty
  # MAIL_HOST leaves this switched off rather than failing at startup.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

ingest:
  # How many boards to fetch at once. Virtual threads make this cheap, but the
  # number is still a politeness budget against other people's servers.
  concurrency: ${INGEST_CONCURRENCY:48}
  user-agent: ${INGEST_USER_AGENT:remote-roles/0.1 (+https://example.com/bot; jobs aggregator)}
  request-timeout: 30s
  # Boards that fail this many times in a row get retired to DEAD.
  max-consecutive-failures: 8
  # Aggregator crawl budget. WeWorkRemotely is a dozen whole-file requests and
  # ignores these. Himalayas is paginated behind Cloudflare and starts refusing
  # after ~60 requests, so each run walks a small slice and resumes next time.
  feed:
    max-pages: ${INGEST_FEED_MAX_PAGES:50}
    concurrency: ${INGEST_FEED_CONCURRENCY:1}
    pause-millis: ${INGEST_FEED_PAUSE_MS:400}

  schedule:
    enabled: ${INGEST_SCHEDULE_ENABLED:true}
    # Every day at 04:17 UTC. Off-the-hour on purpose: everybody's cron fires at
    # :00 and these are other people's servers.
    cron: ${INGEST_CRON:0 17 4 * * *}

# Newsletter. Collection is live; delivery is not.
#
# delivery.enabled stays false until there is SMTP and a verified sending domain.
# While it is false the only Mailer bean is LoggingMailer, which sends nothing, and
# every captured address stays PENDING -- unconfirmed, and not a mailing list.
newsletter:
  delivery:
    enabled: ${NEWSLETTER_DELIVERY_ENABLED:false}
  from-address: ${NEWSLETTER_FROM_ADDRESS:hello@example.com}
  from-name: ${NEWSLETTER_FROM_NAME:Actually Remote}
  site-url: ${SITE_URL:http://localhost:3000}

  # Confirmation sending. A captured address is mailed once, asking the owner to
  # confirm; only then does it become CONFIRMED and mailable. Runs on a short
  # schedule rather than at capture time because the capture happens in the web
  # app and delivery lives here -- a minute of latency on a confirmation is
  # nothing, and it keeps mail in one process.
  # Where a submission waiting for review is announced. Unset means no alert is
  # sent, and the queue is only found by someone opening it.
  review-alert-to: ${REVIEW_ALERT_TO:}

  # The digest. Weekly, not daily: the subscription form promises "one message a
  # week", and a list that is mailed more often than it was told is a list that
  # reports the sender as spam.
  digest:
    enabled: ${NEWSLETTER_DIGEST_ENABLED:false}
    cron: ${NEWSLETTER_DIGEST_CRON:0 0 13 * * TUE}
    # Below this many new roles the issue is skipped rather than padded out. An
    # empty newsletter is worse than none: it trains people not to open it.
    min-jobs: ${NEWSLETTER_DIGEST_MIN_JOBS:5}
    max-jobs: ${NEWSLETTER_DIGEST_MAX_JOBS:15}

  # The relay's daily quota, as this system understands it.
  #
  # Set it to the plan's real limit minus a little headroom. Too low only slows
  # the invitation queue; too high puts the system back to discovering the
  # limit by being refused, which is what this exists to stop.
  #
  # The reserve is held back from the first message of the day and may only be
  # spent by mail somebody is waiting for -- confirmation links, review alerts,
  # the digest. Invitations stop at `daily - transactional-reserve`, so a large
  # import cannot leave a person staring at a form whose confirmation never
  # comes.
  budget:
    daily: ${MAIL_DAILY_BUDGET:280}
    transactional-reserve: ${MAIL_TRANSACTIONAL_RESERVE:60}

  # The single invitation sent to a recorded lead.
  #
  # Five every two minutes: 150 an hour, with no burst bigger than five. The
  # earlier shape sent the same kind of volume as one batch of 25 on the hour,
  # which is both slower to drain an import and a worse pattern to present to a
  # filter -- a spike and then nothing looks like a campaign, a trickle looks
  # like a product. Raise the batch before the frequency if more is needed: the
  # burst size is the part a relay reacts to.
  invite:
    enabled: ${NEWSLETTER_INVITE_ENABLED:true}
    cron: ${NEWSLETTER_INVITE_CRON:0 */2 * * * *}
    batch-size: ${NEWSLETTER_INVITE_BATCH:5}

  confirmation:
    enabled: ${NEWSLETTER_CONFIRMATION_ENABLED:true}
    cron: ${NEWSLETTER_CONFIRMATION_CRON:0 * * * * *}
    # A cap per run, so a bad day cannot empty the daily sending quota.
    batch-size: ${NEWSLETTER_CONFIRMATION_BATCH:20}

logging:
  level:
    com.remoteroles: INFO

# Telling Google when a posting appears or goes away.
#
# Off unless a key file is configured. The API accepts only URLs carrying
# JobPosting structured data, which is what every /jobs page here publishes.
#
# daily-budget is a self-imposed ceiling well under the default quota: the board
# holds sixteen thousand postings and the quota is a couple of hundred calls a
# day, so the notifier works through a capped batch each hour rather than trying
# to announce the corpus and exhausting the day on its first slice.
indexing:
  enabled: ${INDEXING_ENABLED:false}
  key-file: ${INDEXING_KEY_FILE:}
  daily-budget: ${INDEXING_DAILY_BUDGET:180}
  cron: ${INDEXING_CRON:0 25 * * * *}

# The second reader on a worldwide listing.
#
# Runs after the ingest, never inside it: a model that is slow or unreachable
# must not be able to hold up a fetch. Only listings the rule classifier called
# WORLDWIDE are ever sent, which is about twenty-seven a day out of nearly four
# hundred -- a role already gated cannot contradict a promise it does not make,
# so paying to read one would buy nothing.
#
# The cheapest model available was also the most accurate on this task, scoring
# 26/26 against hand-checked answers across three runs where the dearer one
# scored 25. Measured cost at that volume is about forty US cents a month.
scope-review:
  enabled: ${SCOPE_REVIEW_ENABLED:false}
  key-file: ${SCOPE_REVIEW_KEY_FILE:}
  project: ${SCOPE_REVIEW_PROJECT:actually-remote}
  # Only the global endpoint serves Gemini for this project; us-central1
  # answers NOT_FOUND for every model name.
  location: ${SCOPE_REVIEW_LOCATION:global}
  model: ${SCOPE_REVIEW_MODEL:gemini-3.1-flash-lite}
  # Doubled from 60. The figure used to decide, in effect, which listings were
  # ever read at all: the pass took the batch newest-first out of a ten-year
  # window, so anything behind one night's arrivals was skipped every night
  # forever. The order is oldest-first now, so this only governs how fast a
  # backlog drains -- and at ~27 worldwide arrivals a day against a bill of
  # cents a month, the headroom is free.
  batch-size: ${SCOPE_REVIEW_BATCH:120}
  # How far back the nightly pass will look.
  #
  # This was three days, to stop the pass working backwards through a corpus of
  # 1,363 listings nobody had asked it to read. That corpus has since been read
  # on purpose, in one catch-up, so the guard had nothing left to guard -- and
  # it had become the hole instead: the listings a removed classifier rule had
  # been holding at UNKNOWN return to WORLDWIDE on their next fetch, months
  # after they arrived, and a three-day window would never look at them.
  #
  # Effectively no limit now. The mechanism stays because a bulk import could
  # recreate a backlog overnight, and then it is the difference between a
  # surprise bill and a deliberate one.
  max-age-days: ${SCOPE_REVIEW_MAX_AGE_DAYS:3650}
  # The date this pass went live. Everything first seen after it is in scope
  # permanently; anything before it is the historical corpus. It is the anchored
  # alternative to max-age-days above, and with that set wide open it does
  # nothing -- it exists so that narrowing the age limit cannot re-open the hole
  # where a listing is skipped forever.
  corpus-floor: ${SCOPE_REVIEW_CORPUS_FLOOR:2026-10-23}
  # Twenty minutes after the ingest, which runs at 04:17.
  cron: ${SCOPE_REVIEW_CRON:0 40 4 * * *}

# The CV retention sweep.
#
# A candidate who deletes their account has every document no application points
# at destroyed on the spot; the ones an employer was actually sent go on a
# ninety-day clock instead. This is the clock. The work happens in the web
# process because that is where the bucket credentials are and the only place
# they should be -- see ResumeRetentionJob for why that beat holding a second
# copy of them here.
#
# Inert without a token: no INTERNAL_TASK_TOKEN means nothing is called and the
# documents wait, which is the right direction to fail in for a deletion.
# Revisão prioritária das vagas de empregador pagante. Ver decisão 4 de
# docs/plano-starter.md e a classe PostingReviewer.
#
# Desligado por padrão, e inerte sem o token mesmo quando ligado: sem
# INTERNAL_TASK_TOKEN a chamada nunca é feita e a vaga espera uma pessoa, que é
# o que acontecia antes desta classe existir. A chave de serviço é a mesma do
# scope-review; não há segunda credencial.
posting-review:
  enabled: ${POSTING_REVIEW_ENABLED:false}
  key-file: ${POSTING_REVIEW_KEY_FILE:${SCOPE_REVIEW_KEY_FILE:}}
  project: ${POSTING_REVIEW_PROJECT:${SCOPE_REVIEW_PROJECT:actually-remote}}
  location: ${POSTING_REVIEW_LOCATION:global}
  model: ${POSTING_REVIEW_MODEL:gemini-3.1-flash-lite}
  web-url: ${POSTING_REVIEW_WEB_URL:http://web:3000}
  token: ${INTERNAL_TASK_TOKEN:}
  # Um minuto, porque "em minutos" é o que a página de preços promete.
  interval-ms: ${POSTING_REVIEW_INTERVAL_MS:60000}
  batch-size: ${POSTING_REVIEW_BATCH:10}

retention:
  web-url: ${RETENTION_WEB_URL:http://web:3000}
  token: ${INTERNAL_TASK_TOKEN:}
  cron: ${RETENTION_CRON:0 20 3 * * *}
